<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bridlewood Turn Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#E9ECEA; --surface:#FFFFFF; --surface-2:#F3F5F4;
  --ink:#161A19; --ink-2:#414A48; --muted:#6B7472; --line:#CDD4D1; --line-2:#DEE3E1;
  --done:#0F766E; --done-soft:#D9EEEB; --done-ink:#0B5F58; --on-done:#FFFFFF;
  --flag:#9A5B12; --flag-soft:#F7ECD9;
  --shadow:0 1px 2px rgba(22,26,25,.06),0 6px 18px -8px rgba(22,26,25,.18);
  --t-paint:#7C6BB5; --t-window:#2F7FB5; --t-door:#B5722F; --t-floor:#8A6A3B;
  --t-elec:#C2A014; --t-land:#3F8F4E; --t-cab:#9A5A7A; --t-common:#5A6B78;
  --t-appl:#2F8E8A; --t-plumb:#3A63B5; --t-hvac:#7A8A2F; --t-env:#7A6A55;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121615; --surface:#1B211F; --surface-2:#222927;
  --ink:#ECF0EE; --ink-2:#C2CAC7; --muted:#8C9793; --line:#333C39; --line-2:#2A312F;
  --done:#4DD6C5; --done-soft:#123430; --done-ink:#8FE8DC; --on-done:#062522;
  --flag:#E8B871; --flag-soft:#3A2C16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  --t-paint:#A798D6; --t-window:#6FB2DE; --t-door:#DBA06A; --t-floor:#C2A173;
  --t-elec:#E0C64A; --t-land:#6FC17F; --t-cab:#C88CAB; --t-common:#93A5B2;
  --t-appl:#5FC0BB; --t-plumb:#7C9BE0; --t-hvac:#B2C05F; --t-env:#BFAE94;
}}
:root[data-theme="dark"]{
  --paper:#121615; --surface:#1B211F; --surface-2:#222927;
  --ink:#ECF0EE; --ink-2:#C2CAC7; --muted:#8C9793; --line:#333C39; --line-2:#2A312F;
  --done:#4DD6C5; --done-soft:#123430; --done-ink:#8FE8DC; --on-done:#062522;
  --flag:#E8B871; --flag-soft:#3A2C16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  --t-paint:#A798D6; --t-window:#6FB2DE; --t-door:#DBA06A; --t-floor:#C2A173;
  --t-elec:#E0C64A; --t-land:#6FC17F; --t-cab:#C88CAB; --t-common:#93A5B2;
  --t-appl:#5FC0BB; --t-plumb:#7C9BE0; --t-hvac:#B2C05F; --t-env:#BFAE94;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--done);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px 0}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.addr{flex:1 1 220px;min-width:0}
.addr h1{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.addr .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.addr .sub b{color:var(--ink-2);font-weight:600}
.ring{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ring svg{display:block}
.ring .rt{line-height:1.1}
.ring .rt .n{font-family:"Barlow Semi Condensed",sans-serif;font-size:20px;font-weight:700}
.ring .rt .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.tools{display:flex;gap:8px;align-items:center;padding:10px 0 0;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:2px}
.seg button{
  padding:7px 13px;font-family:"Barlow Semi Condensed",sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.02em;border-radius:6px;color:var(--muted);white-space:nowrap;
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.srch{flex:1 1 160px;display:flex;align-items:center;gap:7px;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:8px;padding:0 10px;min-width:0}
.srch input{flex:1;min-width:0;background:none;border:0;padding:9px 0;font:inherit;font-size:14.5px;color:var(--ink)}
.srch input::placeholder{color:var(--muted)}
.srch svg{flex:0 0 auto;color:var(--muted)}
.chk-hide{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);
  padding:8px 11px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;white-space:nowrap}
.chk-hide input{width:16px;height:16px;accent-color:var(--done);margin:0}

.cartbar{
  display:flex;align-items:center;gap:7px;margin-top:9px;padding:7px 10px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;
  overflow-x:auto;scrollbar-width:none;
}
.cartbar::-webkit-scrollbar{display:none}
.cb-ico{flex:0 0 auto;width:19px;height:19px;color:var(--ink-2)}
.cb-ico svg{width:19px;height:19px;display:block}
.cartbar.is-empty .cb-ico{color:var(--muted)}
.cb-empty{font-size:12.5px;color:var(--muted);line-height:1.3}
.cb-empty b{color:var(--flag);font-weight:600}
.cb-chip{
  flex:0 0 auto;display:flex;align-items:baseline;gap:6px;padding:5px 11px;
  border-radius:7px;background:var(--surface);border:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.cb-chip b{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  font-size:13.5px;color:var(--ink-2);letter-spacing:.02em}
.cb-chip .cb-sub{font-family:Barlow,sans-serif;font-size:11px;font-weight:500;color:var(--done)}
.cb-chip.cb-got{opacity:.6}
.cb-chip.cb-got b{color:var(--done)}
.cb-chip.cb-zero{color:var(--muted);background:transparent;border-style:dashed}
.cb-chip.cb-zero b{color:var(--muted)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:0 -16px;
  padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump button{
  flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);white-space:nowrap;
}
.jump button .c{color:var(--muted);font-size:11.5px;margin-left:5px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.jump button.all-done{color:var(--muted);border-color:var(--line-2)}
.jump button.all-done .c{color:var(--done)}

/* ---------- layout ---------- */
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 96px}
.grp{margin:0 0 22px}
.grp-h{
  display:flex;align-items:baseline;gap:9px;padding:0 2px 8px;
  border-bottom:1.5px solid var(--line);margin-bottom:10px;
}
.grp-h h2{font-size:17px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0}
.grp-h .meta{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.grp-h .meta b{color:var(--done);font-weight:600}

/* ---------- task row ---------- */
.task{
  position:relative;display:flex;align-items:flex-start;gap:12px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 12px 11px 14px;margin-bottom:7px;
  border-left:4px solid var(--tc,var(--line));
  transition:opacity .15s,background .15s;
}
.task.done{
  background:var(--done-soft);border-color:transparent;
  border-left-color:var(--done);
}
.task.done .t-name{color:var(--done-ink);font-weight:600}
.donerow{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.done-badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:6px;
  background:var(--done);color:var(--on-done);
  font-family:"Barlow Semi Condensed",sans-serif;font-size:12.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.done-badge svg{width:13px;height:13px}
.done-by{font-size:12.5px;color:var(--done-ink);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mode{
  display:inline-flex;align-items:center;gap:6px;margin-top:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);
}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.mode.shared{color:var(--done)}
.mode.connecting{color:var(--muted);opacity:.7}
.mode.local{color:var(--flag)}
.mode.offline{color:var(--flag)}
.reopen{
  padding:5px 11px;border:1px solid var(--done);border-radius:7px;
  font-family:"Barlow Semi Condensed",sans-serif;font-size:13.5px;font-weight:600;
  color:var(--done);letter-spacing:.02em;background:transparent;
}
.tickwrap{align-self:flex-start;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;margin-top:1px}
.tick{
  width:38px;height:38px;flex:0 0 auto;
  border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;
  background:var(--surface);color:transparent;
}
.tick svg{width:20px;height:20px}
.tickcap{font-size:9px;font-weight:700;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);text-align:center}
.task.done .tickcap{color:var(--done)}
/* The header shrinks out of the way once you start working down the list.
   Only the two text lines collapse — the title and ring keep their size, so
   nothing else on the row moves. Collapsing with max-height (not display)
   keeps it smooth, and the 120/24px gap between the thresholds is wide
   enough that the height change can never re-trigger the toggle. */
.top .addr .sub,.top .addr .mode{
  overflow:hidden;max-height:44px;opacity:1;
  transition:max-height .18s ease,opacity .14s ease,margin-top .18s ease;
}
.top.compact .addr .sub,.top.compact .addr .mode{max-height:0;opacity:0;margin-top:0}
.task.done .tick{background:var(--done);border-color:var(--done);color:var(--on-done)}
.t-body{flex:1 1 auto;min-width:0}
.t-name{font-family:"Barlow Semi Condensed",sans-serif;font-size:16.5px;font-weight:600;
  line-height:1.25;letter-spacing:.005em}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.pill{font-size:11.5px;line-height:1;padding:4px 7px;border-radius:5px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.pill.room{background:transparent}
.pill.qty{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.pill.buy{background:var(--flag-soft);border-color:transparent;color:var(--flag);font-weight:600}
.pill.trade{border-color:transparent;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);font-weight:600}
.note{
  margin-top:7px;font-size:14px;line-height:1.45;color:var(--ink-2);
  border-left:2px solid var(--line);padding-left:9px;
}
.cartpick{
  display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;
  padding:8px 10px;border:1.5px dashed var(--flag);border-radius:9px;
  background:var(--flag-soft);
}
.cartpick.in{border-style:solid;border-color:var(--done);background:var(--done-soft)}
.cp-l{
  flex:1 0 100%;
  font-family:"Barlow Semi Condensed",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--flag);margin-bottom:1px;
}
.cp-b{flex:1 1 auto}
.cartpick.in .cp-l{color:var(--done)}
.cp-b{
  height:34px;padding:0 10px;border:1.5px solid var(--flag);
  border-radius:8px;background:var(--surface);
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:14.5px;
  color:var(--flag);letter-spacing:.02em;
}
.cp-b.hint{border-style:dashed;opacity:.9}
.cartpick.in .cp-b{border-color:var(--line);color:var(--muted);background:transparent}
.cp-b.on,.cartpick.in .cp-b.on{
  background:var(--done);border-color:var(--done);color:var(--on-done);
}
.cp-x{
  margin-left:auto;padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600;
  color:var(--muted);border:1px solid var(--line);background:transparent;
}
.tick.add{border-color:var(--flag);color:var(--flag)}
.tick.add.in{background:var(--done);border-color:var(--done);color:var(--on-done)}
.note::before{content:"Inspector: ";font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:1px;font-weight:600}
.thumb{
  align-self:flex-start;width:62px;height:62px;flex:0 0 auto;
  border-radius:8px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-2);
  padding:0;position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{
  content:"";position:absolute;inset:0;border-radius:7px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
}
.thumb:active{transform:scale(.97)}

/* ---------- materials ---------- */
.mat-intro{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:13px 15px;margin-bottom:18px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.mat-intro b{color:var(--ink)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
.grp.store{margin-bottom:26px}
.store-h{display:flex;align-items:flex-end;gap:10px;padding:0 2px 9px;
  border-bottom:2px solid var(--tcs,var(--line));margin-bottom:10px}
.store[data-store="hd"]{--tcs:#D9772B}
.store[data-store="az"]{--tcs:#3E8FA8}
.store[data-store="ot"]{--tcs:var(--muted)}
.store-t{flex:1;min-width:0}
.store-h h2{font-size:19px;font-weight:700;letter-spacing:.01em}
.store-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.store-h .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.store-h .meta b{color:var(--ink);font-weight:700;font-size:15px}
.store-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.store-empty{opacity:.75}
.store-empty .store-h{border-bottom-style:dashed}
.store-none{
  padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);
  font-size:13.5px;color:var(--muted);line-height:1.4;background:transparent;
}
.mat.settled{border-style:dashed;opacity:.72}
.settled-tag{color:var(--done);font-weight:600}
.qty{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.qty > button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);font-size:19px;line-height:1;color:var(--ink);
  display:grid;place-items:center;flex:0 0 auto}
.qty > button:active{background:var(--line-2)}
.qty input{width:52px;height:34px;text-align:center;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:600;
  padding:0;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty-lbl{font-size:11.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.qty-rst{font-size:11.5px;color:var(--flag);background:var(--flag-soft);border-radius:6px;
  padding:5px 8px;font-weight:600;line-height:1}
.mat.done .qty,.mat.done .swap{display:none}
.swap{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.swap-l{font-size:11.5px;color:var(--muted);letter-spacing:.03em;
  text-transform:uppercase;margin-right:2px}
.swap > button{
  min-width:40px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface-2);font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  font-size:14px;color:var(--muted);letter-spacing:.02em;
}
.swap > button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;
  font-family:"Barlow Semi Condensed",sans-serif;letter-spacing:.02em;color:var(--ink);
}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mat{
  display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 12px 11px 14px;margin-bottom:7px;
}
.mat.done{opacity:.5;background:var(--surface-2)}
.mat.done .m-name{text-decoration:line-through;text-decoration-thickness:1.5px}
.mat > .tick{grid-column:1;grid-row:1}
.m-body{grid-column:2;grid-row:1;min-width:0}
.m-buy{grid-column:3;grid-row:1}
.m-name{font-family:"Barlow Semi Condensed",sans-serif;font-size:16px;font-weight:600;line-height:1.25}
.m-for{font-size:12.5px;color:var(--muted);margin-top:3px}
.m-buy{display:flex;gap:6px;flex:0 0 auto;align-self:center}
.m-buy a{
  display:grid;place-items:center;width:38px;height:38px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);text-decoration:none;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--ink-2);
}
.m-note{grid-column:1/-1;grid-row:2;margin-top:7px;font-size:13px;color:var(--flag);
  background:var(--flag-soft);border-radius:6px;padding:6px 9px;line-height:1.4}

/* ---------- lightbox ---------- */
.lb{
  position:fixed;inset:0;z-index:100;background:rgba(10,13,12,.94);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.lb-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#E9ECEA;flex:0 0 auto}
.lb-bar .lb-t{flex:1;min-width:0;font-family:"Barlow Semi Condensed",sans-serif;
  font-size:16px;font-weight:600;line-height:1.2}
.lb-bar .lb-t span{display:block;font-family:Barlow,sans-serif;font-size:12px;font-weight:400;
  color:#9AA5A2;margin-top:1px}
.lb-bar button{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);color:#E9ECEA;flex:0 0 auto}
.lb-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px;position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px 14px;color:#E9ECEA;flex:0 0 auto}
.lb-nav button{padding:10px 16px;border-radius:8px;background:rgba(255,255,255,.1);
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:15px;color:#E9ECEA}
.lb-nav button:disabled{opacity:.3}
.lb-nav .lb-c{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#9AA5A2;font-variant-numeric:tabular-nums}
.lb-mark{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;

        + (qtyOf(m) !== m.qty ? '<button class="qty-rst" data-qrst="' + m.id + '">scope says ' + m.qty + ' &mdash; reset</button>' : '<span class="qty-lbl">from the scope</span>')
      + '</div>'
      + (m.q ? '<div class="m-find">Look it up: '
          + '<a href="' + STORES.hd[2] + encodeURIComponent(m.q) + '" target="_blank" rel="noopener">Home Depot</a>'
          + '<a href="' + STORES.az[2] + encodeURIComponent(m.q) + '" target="_blank" rel="noopener">Amazon</a>'
          + '</div>' : "")
      + '</div>'
      + '<div class="m-buy"></div>'
      + (m.caution ? '<div class="m-note">' + esc(m.caution) + '</div>' : "")
      + '</div>';
  });
  html += '</section>';

  document.getElementById("wrap").innerHTML = html;
  document.getElementById("jump").innerHTML = "";
}

function cartText(){
  var lines = MATS.filter(function(m){ return state.cart[m.id] && !state.mats[m.id]; })
    .map(function(m){ return qtyOf(m) + "x  " + m.name + (m.caution ? "\n     " + m.caution : ""); });
  return JOB.short + ", " + JOB.cityLine + " - Turn " + JOB.turn + "\n"
    + "Shopping list (" + lines.length + (lines.length === 1 ? " item):" : " items):") + "\n" + lines.join("\n");
}

function renderCartBar(){
  var el = document.getElementById("cartbar");
  var ico = '<span class="cb-ico" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M2 3h2.2l1.9 9.2a1.4 1.4 0 0 0 1.4 1.1h7.1a1.4 1.4 0 0 0 1.4-1.1L17.5 6H5"/><circle cx="8" cy="17" r="1.1"/><circle cx="15" cy="17" r="1.1"/></svg></span>';
  var inCart = MATS.filter(function(m){ return state.cart[m.id]; });
  var left = inCart.filter(function(m){ return !state.mats[m.id]; }).length;
  var got = inCart.length - left;
  if(!inCart.length){
    el.className = "cartbar is-empty";
    el.innerHTML = ico + '<span class="cb-empty">Shopping list is empty &mdash; hit <b>Add</b> as you go</span>';
    return;
  }
  el.className = "cartbar";
  el.innerHTML = ico
    + '<button class="cb-chip" data-cb="1"><b>' + left + '</b> to get</button>'
    + (got ? '<span class="cb-got mono">' + got + ' in truck</span>' : '')
    + '<span class="cb-open">See list &rarr;</span>';
}

function renderProgress(){
  var n = T.filter(function(t){ return state.done[t.id]; }).length;
  var pct = Math.round(n / T.length * 100);
  document.getElementById("ringN").textContent = n + "/" + T.length;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset", (119.4 * (1 - n / T.length)).toFixed(1));
  document.getElementById("barN").textContent = n + " of " + T.length;
  document.getElementById("barI").style.width = pct + "%";
  document.getElementById("barPct").textContent = pct + "%";
}

function render(){
  if(view === "mat") renderMats(); else renderTasks();
  renderProgress();
  renderCartBar();
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function coBlankLine(){ return {room:"", item:"", desc:"", qty:"", price:""}; }
function coBlank(){ return {cs:"", by:lsGet("turnsheet.by") || "", lines:[coBlankLine()]}; }

var co = null, coHist = [];
try{ co = JSON.parse(lsGet(CO_KEY) || "null"); }catch(e){}
if(!co || !co.lines || !co.lines.length) co = coBlank();
try{ coHist = JSON.parse(lsGet(COH_KEY) || "[]") || []; }catch(e){ coHist = []; }

function coSave(){ lsSet(CO_KEY, JSON.stringify(co)); if(co.by) lsSet("turnsheet.by", co.by); }
function coNum(v){
  var n = parseFloat(String(v == null ? "" : v).replace(/[$,\s]/g, ""));
  return isFinite(n) ? n : null;
}
function coTrim(v){ return String(v == null ? "" : v).trim(); }
function coLineUsed(l){
  return !!(l.room || coTrim(l.item) || coTrim(l.desc) || coTrim(l.qty) || coTrim(l.price));
}
function coUsed(){ return co.lines.filter(coLineUsed); }
function cents(n){ return Math.round(n * 100) / 100; }
function coLineTotal(l){
  var q = coNum(l.qty), p = coNum(l.price);
  return (q != null && p != null) ? cents(q * p) : 0;
}
function coTotal(){ return cents(coUsed().reduce(function(s, l){ return s + coLineTotal(l); }, 0)); }
function money(n){
  return "$" + (n || 0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function coSnap(how){
  if(!coUsed().length) return;
  var data = JSON.stringify(co), last = coHist[0], now = new Date().toISOString();
  if(last && last.data === data){ last.how = how; last.at = now; }
  else coHist.unshift({at:now, how:how, data:data});
  coHist = coHist.slice(0, 20);
  lsSet(COH_KEY, JSON.stringify(coHist));
}

/* ---- writing the .xlsx: cell edits on the template's sheet XML, then a
   stored (uncompressed) zip — no library, works offline ---- */
function b64bytes(b){
  var s = atob(b), u = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
function xesc(s){
  return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
    .replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
/* Replace one existing cell's contents, keeping its style. The template has
   every cell the form writes to, so a missing ref means the template changed. */
function setCell(xml, ref, val){
  var re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
  var m = re.exec(xml);
  if(!m) throw new Error("change order template has no cell " + ref);
  var attrs = m[1].replace(/\s+t="[^"]*"/, ""), body;
  if(val.f){ body = "<f>" + val.f + "</f><v>" + (val.v || 0) + "</v>"; }
  else if(typeof val.v === "number"){ body = "<v>" + val.v + "</v>"; }
  else { attrs += ' t="inlineStr"'; body = '<is><t xml:space="preserve">' + xesc(val.v) + "</t></is>"; }
  return xml.slice(0, m.index) + '<c r="' + ref + '"' + attrs + ">" + body + "</c>"
    + xml.slice(m.index + m[0].length);
}
var CRC_T = null;
function crc32(b){
  if(!CRC_T){
    CRC_T = [];
    for(var n = 0; n < 256; n++){
      var c = n;
      for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_T[n] = c >>> 0;
    }
  }
  var x = 0xFFFFFFFF;
  for(var i = 0; i < b.length; i++) x = CRC_T[(x ^ b[i]) & 0xFF] ^ (x >>> 8);
  return (x ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  var enc = new TextEncoder(), parts = [], central = [], off = 0;
  function u16(v){ return [v & 255, (v >>> 8) & 255]; }
  function u32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  files.forEach(function(f){
    var nm = enc.encode(f[0]), d = f[1], crc = crc32(d);
    var lh = [0x50,0x4b,0x03,0x04].concat(u16(20), u16(0), u16(0), u16(0), u16(0x21),
      u32(crc), u32(d.length), u32(d.length), u16(nm.length), u16(0));
    parts.push(new Uint8Array(lh), nm, d);
    central.push(new Uint8Array([0x50,0x4b,0x01,0x02].concat(u16(20), u16(20), u16(0), u16(0),
      u16(0), u16(0x21), u32(crc), u32(d.length), u32(d.length), u16(nm.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), nm);
    off += lh.length + nm.length + d.length;
  });
  var cd = central.reduce(function(s, a){ return s + a.length; }, 0);
  var end = new Uint8Array([0x50,0x4b,0x05,0x06].concat(u16(0), u16(0), u16(files.length),

function coBuild(){
  var dec = new TextDecoder(), enc = new TextEncoder();
  var files = CO_TPL.map(function(e){ return [e[0], b64bytes(e[1])]; });
  var sheet = files.filter(function(f){ return f[0] === "xl/worksheets/sheet1.xml"; })[0];
  var x = dec.decode(sheet[1]);
  x = setCell(x, "B4", {v:JOB.addr});
  x = setCell(x, "J4", {v:coNum(JOB.zip) != null ? coNum(JOB.zip) : JOB.zip});
  x = setCell(x, "G8", {v:JOB.scopeTotal});
  if(coTrim(co.cs)) x = setCell(x, "G6", {v:coTrim(co.cs)});
  var sum = 0;
  coUsed().slice(0, CO_MAX).forEach(function(l, i){
    var r = 12 + i, q = coNum(l.qty), p = coNum(l.price), t = coLineTotal(l);
    sum += t;
    if(l.room) x = setCell(x, "D" + r, {v:l.room});
    if(coTrim(l.item)) x = setCell(x, "E" + r, {v:coTrim(l.item)});
    /* the description block is F:Q on lines 1-30 and G:Q on 31-40 (F is hidden) */
    if(coTrim(l.desc)) x = setCell(x, (r <= 41 ? "F" : "G") + r, {v:coTrim(l.desc)});
    if(q != null) x = setCell(x, "R" + r, {v:q});
    if(p != null) x = setCell(x, "S" + r, {v:p});
    x = setCell(x, "T" + r, {f:"R" + r + "*S" + r, v:t});
  });
  sum = cents(sum);
  x = setCell(x, "T52", {f:"SUM(T12:T51)", v:sum});
  x = setCell(x, "U52", {f:"T52+G8", v:cents(sum + JOB.scopeTotal)});
  if(coPhotos.length) x = coEmbedPhotos(x, files, enc, dec);
  sheet[1] = enc.encode(x);
  return zipStore(files);
}

/* embed the change-order photos onto the sheet, below the table, each captioned.
   Mirrors the exact drawing/rels/content-type shape Excel writes for images. */
function coEmbedPhotos(x, files, enc, dec){
  var ph = coPhotos.slice(0, COPH_MAX);
  function idx(n){ for(var i = 0; i < files.length; i++) if(files[i][0] === n) return i; return -1; }
  var rows = '<row r="53"><c r="A53" t="inlineStr"><is><t xml:space="preserve">PHOTOS (' + ph.length + ')</t></is></c></row>';
  var anchors = "";
  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  ph.forEach(function(p, i){
    var cr = 55 + i * 16, rid = "rIdCoPh" + (i + 1);
    var cap = "Photo " + (i + 1) + (coTrim(p.caption) ? ": " + coTrim(p.caption) : "");
    rows += '<row r="' + cr + '"><c r="A' + cr + '" t="inlineStr"><is><t xml:space="preserve">' + xesc(cap) + '</t></is></c></row>';
    anchors += '<xdr:oneCellAnchor><xdr:from><xdr:col>1</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>' + cr + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>'
      + '<xdr:ext cx="3429000" cy="2571750"/>'
      + '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (101 + i) + '" name="Photo ' + (i + 1) + '" descr="Change order photo"/><xdr:cNvPicPr/></xdr:nvPicPr>'
      + '<xdr:blipFill><a:blip cstate="print" r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'
      + '<xdr:spPr><a:prstGeom prst="rect"/></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    rels += '<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="/xl/media/coph' + (i + 1) + '.jpeg"/>';
    files.push(["xl/media/coph" + (i + 1) + ".jpeg", new Uint8Array(p.bytes)]);
  });
  rels += "</Relationships>";
  x = x.replace("</sheetData>", rows + "</sheetData>");
  var ci = idx("[Content_Types].xml"), ct = dec.decode(files[ci][1]);
  if(ct.indexOf('Extension="jpeg"') === -1)
    ct = ct.replace("</Types>", '<Default ContentType="image/jpeg" Extension="jpeg"/></Types>');
  files[ci][1] = enc.encode(ct);
  var di = idx("xl/drawings/drawing1.xml"), dr = dec.decode(files[di][1]);
  files[di][1] = enc.encode(dr.replace("</xdr:wsDr>", anchors + "</xdr:wsDr>"));
  files.push(["xl/drawings/_rels/drawing1.xml.rels", enc.encode(rels)]);
  return x;
}

/* Each job (turn) numbers its change orders 1, 2, 3... A draft gets its number
   the first time it's sent or saved, and it keeps that number after. */
function coPendingNum(){ return co.num || ((parseInt(lsGet(CONUM_KEY), 10) || 0) + 1); }
function coAssignNum(){
  if(co.num) return co.num;
  co.num = coPendingNum();
  lsSet(CONUM_KEY, String(co.num));
  coSave();
  return co.num;
}
function coFileName(){
  var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
  return "Change Order " + (co.num ? co.num + " " : "") + "- " + JOB.short + " - "
    + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".xlsx";
}
function coSummary(){
  var L = ["CHANGE ORDER" + (co.num ? " " + co.num : "") + " REQUEST", JOB.addr + ", FL " + JOB.zip, "Contractor: FLORIDAS GREEN THUMB"];
  if(coTrim(co.cs)) L.push("CS name: " + coTrim(co.cs));
  if(coTrim(co.by)) L.push("From: " + coTrim(co.by));
  L.push("");
  coUsed().forEach(function(l, i){
    L.push((i + 1) + ". " + (l.room || "Room not set") + (coTrim(l.item) ? " - " + coTrim(l.item) : ""));
    if(coTrim(l.desc)) L.push("   " + coTrim(l.desc));
    var q = coNum(l.qty), p = coNum(l.price);
    if(q != null || p != null)
      L.push("   Qty " + (q != null ? q : "-") + " x " + (p != null ? money(p) : "-") + " = " + money(coLineTotal(l)));
  });
  L.push("", "CO requests: " + money(coTotal()), "Scope total: " + money(JOB.scopeTotal),
    "Total (CO request + scoped): " + money(cents(coTotal() + JOB.scopeTotal)));
  return L.join("\r\n");
}

function isTouch(){ return !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches); }
function coDownload(blob, name){
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function coMailto(lead){

  var a = document.createElement("a");

    + "&body=" + encodeURIComponent((lead ? lead + "\r\n\r\n" : "") + coSummary());
  document.body.appendChild(a); a.click(); a.remove();
}
function coSend(){
  if(!coUsed().length) return coSay("Add at least one line first.", true);
  coAssignNum();
  var name = coFileName(), blob;
  try{ blob = coBuild(); }
  catch(err){
    coMailto("(The Excel form couldn't be built on this phone, so here it is as text.)");
    coSnap("emailed as text"); coRender();
    return coSay("Couldn't build the Excel file here, so your mail app opened with it as text instead.", true);
  }
  var file = (typeof File === "function") ? new File([blob], name, {type:XLSX_TYPE}) : null;
  if(file && isTouch() && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name,
        text:"Change order for " + JOB.short + (coTrim(co.by) ? " from " + coTrim(co.by) : "") + ". Send to " + JOB.sendTo})
      .then(function(){
        coSnap("sent"); coRender();
        coSay("Change Order " + co.num + " sent. Start a new one below for the next change.");
      }, function(e){
        if(e && e.name === "AbortError") return;
        coDownload(blob, name);
        coMailto("The Excel change order was just saved to this phone. Attach it to this email.");
        coSnap("sent"); coRender();
        coSay("Change Order " + co.num + ": Excel saved and your mail app opened. Attach the file and hit Send.");
      });
    return;
  }
  coDownload(blob, name);
  coMailto("The Excel change order was just saved to this device (" + name + "). Attach it to this email.");
  coSnap("sent"); coRender();
  coSay("Excel file saved and your mail app opened. Attach " + name + " and hit Send.");
}
function coSaveFile(){
  if(!coUsed().length) return coSay("Add at least one line first.", true);
  coAssignNum();
  var name = coFileName(), blob;
  try{ blob = coBuild(); }catch(err){ return coSay("Couldn't build the Excel file on this device.", true); }
  coDownload(blob, name); coSnap("saved"); coRender();
  coSay("Change Order " + co.num + " saved to this device as " + name + ".");
}
function coClick(e){
  var b = e.target.closest("[data-co]");
  if(!b) return;
  var a = b.dataset.co;
  if(a === "close") return coClose();
  if(a === "send") return coSend();
  if(a === "save") return coSaveFile();
  if(a === "add"){
    if(co.lines.length >= CO_MAX) return;
    co.lines.push(coBlankLine()); coSave(); coRender();
    var nf = document.getElementById("co_room_" + (co.lines.length - 1));
    if(nf){ nf.scrollIntoView({block:"center"}); nf.focus(); }
    return;
  }
  if(a === "del"){
    var i = +b.dataset.i, l = co.lines[i];
    var drop = function(){
      co.lines.splice(i, 1);
      if(!co.lines.length) co.lines.push(coBlankLine());
      coSave(); coRender();
    };
    if(!l) return;
    return coLineUsed(l)
      ? ask("Remove line " + (i + 1) + "?", coTrim(l.item) || coTrim(l.desc) || l.room || "This line", "Remove", drop)
      : drop();
  }
  if(a === "new"){
    return ask("Start a new change order?",
      coUsed().length ? "This one stays under Saved on this phone." : "The form will be cleared.",
      "Start new", function(){
        coSnap("draft");
        var by = co.by; co = coBlank(); co.by = by || co.by;
        coPhClear();
        coSave(); coRender(); coEl.scrollTop = 0;
      });
  }
  if(a === "load"){
    var s = coHist[+b.dataset.k];
    if(!s) return;
    return ask("Open this saved change order?", "It replaces what's in the form now.", "Open it", function(){
      coSnap("draft");
      try{ co = JSON.parse(s.data); }catch(e2){ return; }
      coSave(); coRender(); coEl.scrollTop = 0;
    });
  }
}
/* ---- change-order photos: a camera next to the Change Order button ---- */
var COPH_MAX = 12, coPhotos = [], coPhDB = null, coPhEl = null, coPhUrls = [];
function coPhDBopen(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open("turnsheet-cophotos", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("p", {keyPath:"id"}); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function coPhTx(mode){ return coPhDB.transaction("p", mode).objectStore("p"); }
function coPhPut(it){ return new Promise(function(res){ if(!coPhDB) return res(); try{ var q=coPhTx("readwrite").put(it); q.onsuccess=q.onerror=function(){res();}; }catch(e){res();} }); }
function coPhDel(id){ return new Promise(function(res){ if(!coPhDB) return res(); try{ var q=coPhTx("readwrite").delete(id); q.onsuccess=q.onerror=function(){res();}; }catch(e){res();} }); }
function coPhAll(){ return new Promise(function(res){ if(!coPhDB) return res([]); try{ var q=coPhTx("readonly").getAll(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){res([]);}; }catch(e){res([]);} }); }
function coPhShrink(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1400 / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b || file); }, "image/jpeg", 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
var coPhInput = document.createElement("input");
coPhInput.type = "file"; coPhInput.accept = "image/*";
coPhInput.setAttribute("capture", "environment"); coPhInput.hidden = true;
document.body.appendChild(coPhInput);
coPhInput.addEventListener("change", function(){

function coPhTake(file){

    coPhotos.push({id:id, turn:JOB.turn, at:new Date().toISOString(), caption:"", bytes:buf});

}
function coPhClear(){
  coPhotos.forEach(function(p){ coPhDel(p.id); });

}
function coPhOpen(){
  if(coPhEl) return;
  coPhEl = document.createElement("div");

    + '<div class="co-title"><span>Change Order Photos</span><small>' + esc(JOB.short) + '</small></div></div><div class="co-body"></div>';

function coPhCloseP(){

function coPhRender(){
  var badge = document.getElementById("coPhCount");

  } else {

    coPhotos.forEach(function(p, i){
      var u = URL.createObjectURL(new Blob([p.bytes], {type:"image/jpeg"})); coPhUrls.push(u);
      h += '<div class="coph-item"><img src="' + u + '" alt="Change order photo ' + (i + 1) + '">'

        + '<button class="coph-del" data-coph="del" data-id="' + esc(p.id) + '">Delete</button></div>';
    });

function coPhClick(e){

document.getElementById("coOpen").onclick = coOpen;
(function(){ var b = document.getElementById("coPhotosOpen"); if(b) b.onclick = coPhOpen; })();

/* ============================ LIVE PROGRESS ============================ */
/* Shares checkmarks and carts between every phone through Steve's Turn Sheets
   script (backend/Code.gs). A change goes up the moment it's made; everyone's
   state comes back every 15 seconds while the page is open. With no signal,
   changes wait on this phone (in order) and go up when it's back. */
var BACKEND_URL = "", BACKEND_KEY = "";
var SYNC_ME = "", syncQ = [], syncBusy = false, syncSig = "";
try{ SYNC_ME = localStorage.getItem("turnsheet.by") || ""; }catch(e){}
try{ syncQ = JSON.parse(localStorage.getItem(KEY + ".q") || "[]") || []; }catch(e){ syncQ = []; }
function syncSaveQ(){ try{ localStorage.setItem(KEY + ".q", JSON.stringify(syncQ)); }catch(e){} }

function api(body){
  var b = JSON.parse(JSON.stringify(body));
  b.k = BACKEND_KEY;
  return fetch(BACKEND_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(b)})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || "no answer");
      return j;
    });
}

/* server state -> this page, with this phone's unsent changes laid on top */
function syncApply(s){
  var done = {}, by = {}, cart = {}, got = {}, qty = {}, store = {};
  Object.keys(s.done || {}).forEach(function(id){
    var v = s.done[id] || [];
    done[id] = true;
    by[id] = {by:v[0] || "", at:v[1] ? new Date(v[1] * 1000).toISOString() : ""};
  });
  Object.keys(s.mats || {}).forEach(function(mid){
    var v = s.mats[mid], m = MID[mid];
    if(!m || !v) return;
    if(v.c) cart[mid] = true;
    if(v.g) got[mid] = true;
    if(v.q && v.q !== m.qty) qty[mid] = v.q;
    if(v.s && v.s !== m.store && STORES[v.s]) store[mid] = v.s;
  });
  syncQ.forEach(function(op){
    if(op.op === "task"){
      if(op.done){ done[op.id] = true; by[op.id] = {by:op.by, at:op.at}; }
      else { delete done[op.id]; delete by[op.id]; }
      return;
    }
    var m = MID[op.mid];
    if(!m) return;
    if(op.cart) cart[op.mid] = true; else delete cart[op.mid];
    if(op.got) got[op.mid] = true; else delete got[op.mid];
    if(op.qty !== m.qty) qty[op.mid] = op.qty; else delete qty[op.mid];
    if(op.store !== m.store) store[op.mid] = op.store; else delete store[op.mid];
  });
  state.done = done; DONE_BY = by;
  state.cart = cart; state.mats = got; state.qty = qty; state.store = store;
  save();
  if(typeof camServerCount === "function") camServerCount(s.photos || 0);
  var sig = JSON.stringify([done, by, cart, got, qty, store]);
  if(sig === syncSig) return;
  syncSig = sig;
  /* don't yank a field out from under someone who's typing in it */
  var a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById("wrap").contains(a)) return;
  render();
  if(typeof lb !== "undefined" && lb && typeof paint === "function") paint();
}

function syncPush(op){
  op.turn = JOB.turn; op.by = SYNC_ME; op.at = new Date().toISOString();
  /* a newer change to the same task / material replaces an older unsent one */
  syncQ = syncQ.filter(function(o){
    return !(o.op === op.op && (o.op === "task" ? o.id === op.id : o.mid === op.mid));
  });
  syncQ.push(op);
  syncSaveQ();
  syncFlush();
}
function syncFlush(){
  if(syncBusy || !syncQ.length || !BACKEND_URL) return;
  syncBusy = true;
  var op = syncQ[0];
  api(op).then(function(s){
    syncQ = syncQ.filter(function(o){ return o !== op; });
    syncSaveQ();
    syncBusy = false;
    setMode("shared");
    if(syncQ.length) syncFlush(); else syncApply(s);
  }).catch(function(){
    syncBusy = false;
    setMode("offline");
  });
}
function syncPoll(){
  if(!BACKEND_URL || document.hidden) return;
  if(syncQ.length){ syncFlush(); return; }
  api({op:"state", turn:JOB.turn})
    .then(function(s){ setMode("shared"); syncApply(s); })
    .catch(function(){ setMode("offline"); });
}
function syncStart(){
  setMode("connecting");
  syncPoll();
  setInterval(syncPoll, 15000);
  window.addEventListener("online", syncPoll);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) syncPoll(); });
}

/* the page's save hooks now go to the shared list */
commitTask = function(id, done){
  if(BACKEND_URL) syncPush({op:"task", id:String(id), done:!!done});
};
commitMat = function(mid){
  var m = MID[mid];
  if(!m || !BACKEND_URL) return;
  syncPush({op:"mat", mid:mid, cart:!!state.cart[mid], got:!!state.mats[mid], qty:qtyOf(m), store:storeOf(m)});
};
/*SYNC:JS-END*/

/*CAM:JS-BEGIN*/
/* ============================ CAMERA ============================ */
/* A camera button on every room. Photos are shrunk on the phone, kept in the
   phone's own storage (IndexedDB) and uploaded one at a time to Steve's Google
   Drive through the Turn Sheets script:  Turn Photos / <house> / <room>.
   No signal? They wait on the phone and go when it's back. If uploads aren't
   switched on, "Send all photos" shares them instead. */
var CAM_MAX = 1600, CAM_Q = 0.8;
var camDB = null, camItems = [], camRoom = "", camBusy = false, camEl = null, camUrls = [], camCrew = null;
var CAM_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h2l1.2-1.6h4.6L13.5 5h2A1.5 1.5 0 0 1 17 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z"/>'
  + '<circle cx="10" cy="10.5" r="3"/></svg>';
function camOn(){ return typeof BACKEND_URL === "string" && !!BACKEND_URL; }

/* ---- the phone's photo storage ---- */
function camOpenDB(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open("turnsheet-photos", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("p", {keyPath:"id"}); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function camStore(mode){ return camDB.transaction("p", mode).objectStore("p"); }
function camPut(it){
  return new Promise(function(res){
    if(!camDB) return res();
    try{ var q = camStore("readwrite").put(it); q.onsuccess = q.onerror = function(){ res(); }; }
    catch(e){ res(); }
  });
}
function camRemove(id){
  return new Promise(function(res){
    if(!camDB) return res();
    try{ var q = camStore("readwrite").delete(id); q.onsuccess = q.onerror = function(){ res(); }; }
    catch(e){ res(); }
  });
}
function camLoad(){
  return new Promise(function(res){
    if(!camDB) return res([]);
    try{ var q = camStore("readonly").getAll(); q.onsuccess = function(){ res(q.result || []); }; q.onerror = function(){ res([]); }; }
    catch(e){ res([]); }
  });
}

/* ---- taking a photo ---- */
function camShrink(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, CAM_MAX / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b || file); }, "image/jpeg", CAM_Q);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
function camName(room, d, id){
  var p = function(n){ return (n < 10 ? "0" : "") + n; };
  var h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return room + " " + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " "
    + h + "-" + p(d.getMinutes()) + "-" + p(d.getSeconds()) + " " + ap + " " + id.slice(-4) + ".jpg";
}
var camInput = document.createElement("input");
camInput.type = "file";
camInput.accept = "image/*";
camInput.setAttribute("capture", "environment");
camInput.hidden = true;
document.body.appendChild(camInput);
camInput.addEventListener("change", function(){
  var f = camInput.files && camInput.files[0];
  camInput.value = "";
  if(f) camAdd(f, camRoom);
});
function camTake(room){ camRoom = room; camInput.click(); }
function camAdd(file, room){
  camToast("Saving " + room + " photo…");
  camShrink(file).then(function(blob){
    var d = new Date(), id = d.getTime().toString(36) + Math.random().toString(36).slice(2, 6);
    var it = {id:id, turn:JOB.turn, house:JOB.short, room:room, at:d.toISOString(),
              name:camName(room, d, id), status:"waiting", blob:blob};
    camItems.push(it);
    return camPut(it).then(function(){
      camRefresh();
      camToast(camOn() ? room + " photo saved · uploading" : room + " photo saved on this phone");
      camPump();
    });
  }).catch(function(e){ camToast("That photo couldn't be saved: " + ((e && e.message) || e)); });
}

/* ---- uploading, one at a time ---- */
function camB64(blob){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(String(r.result).split(",")[1]); };
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function camPump(){
  if(camBusy || !camOn() || navigator.onLine === false) return;
  var next = camItems.filter(function(i){ return i.status === "waiting"; })[0];
  if(!next) return;
  camBusy = true;
  camB64(next.blob).then(function(data){
    return api({op:"photo", turn:JOB.turn, house:JOB.short, room:next.room, name:next.name, data:data});
  }).then(function(){
    next.status = "sent"; next.err = "";
    return camPut(next);
  }).catch(function(e){
    next.status = "failed"; next.err = String((e && e.message) || e);
    return camPut(next);
  }).then(function(){
    camBusy = false;
    camRefresh();
    if(camItems.some(function(i){ return i.status === "waiting"; })) setTimeout(camPump, 250);
  });
}
function camRetry(){
  camItems.forEach(function(i){ if(i.status === "failed") i.status = "waiting"; });
  camPump();
}
function camServerCount(n){ camCrew = n; if(camEl) camPanel(); }

/* ---- what shows on the page ---- */
function camCount(room){
  var a = camItems.filter(function(i){ return room == null || i.room === room; });
  return {n:a.length, left:a.filter(function(i){ return i.status !== "sent"; }).length,
          bad:a.filter(function(i){ return i.status === "failed"; }).length};
}
/* called by the page for each room heading (room view only) */
function camBtn(room){
  if(view !== "room") return "";
  var c = camCount(room);
  return '<button class="cam-btn' + (c.n ? " has" : "") + (c.bad ? " bad" : "") + '" data-cam="' + esc(room)
    + '" aria-label="Take a photo in ' + esc(room) + '">' + CAM_ICON
    + (c.n ? '<span class="cam-n mono">' + c.n + '</span>' : '')
    + (c.left ? '<span class="cam-wait">' + (c.bad ? "retry" : c.left + " to send") + '</span>' : '')
    + '</button>';
}
function camRefresh(){
  if(view === "room") render();
  var c = camCount(null), b = document.getElementById("camAll");
  if(b){
    b.querySelector(".cam-all-n").textContent = c.n;
    b.classList.toggle("waiting", c.left > 0);
    b.classList.toggle("bad", c.bad > 0);
  }
  if(camEl) camPanel();
}
var camToastT = null;
function camToast(t){
  var el = document.getElementById("camToast");
  if(!el){ el = document.createElement("div"); el.id = "camToast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = t;
  el.className = "show";
  clearTimeout(camToastT);
  camToastT = setTimeout(function(){ el.className = ""; }, 2600);
}

/* ---- the photos panel ---- */
function camPanelOpen(){
  if(camEl) return;
  camEl = document.createElement("div");
  camEl.className = "co";
  camEl.setAttribute("role", "dialog");
  camEl.setAttribute("aria-modal", "true");
  camEl.setAttribute("aria-labelledby", "camT");
  camEl.innerHTML = '<div class="co-top">'
    + '<button class="co-back" data-camp="close" aria-label="Back to the scope">&larr; Scope</button>'
    + '<div class="co-title"><span id="camT">Photos</span><small>' + esc(JOB.short) + '</small></div>'
    + '</div><div class="co-body"></div>';
  document.body.appendChild(camEl);
  document.body.style.overflow = "hidden";
  camEl.addEventListener("click", camPanelClick);
  camPanel();
}
function camPanelClose(){
  if(!camEl) return;
  camUrls.forEach(function(u){ URL.revokeObjectURL(u); }); camUrls = [];
  camEl.remove(); camEl = null;
  document.body.style.overflow = "";
}
function camPanel(){
  if(!camEl) return;
  camUrls.forEach(function(u){ URL.revokeObjectURL(u); }); camUrls = [];
  var c = camCount(null), rooms = [];
  camItems.forEach(function(i){ if(rooms.indexOf(i.room) === -1) rooms.push(i.room); });
  var h = '<section class="co-card">';
  if(camOn()){
    h += '<p class="cam-p">Photos upload to Steve&rsquo;s Google Drive by themselves: '
      + '<b>Turn Photos / ' + esc(JOB.short) + ' / <i>room</i></b>.</p>'
      + '<p class="cam-p mono">' + c.n + ' on this phone &middot; ' + (c.n - c.left) + ' uploaded'
      + (c.left ? ' &middot; ' + c.left + ' waiting' : '') + '</p>'
      + (camCrew != null ? '<p class="cam-p">Whole crew so far: <b class="mono">' + camCrew + '</b> in Drive.</p>' : '')
      + (c.left && navigator.onLine === false ? '<p class="cam-p warn">No signal. They&rsquo;ll upload when it&rsquo;s back.</p>' : '')
      + (c.bad ? '<p class="cam-p warn">' + c.bad + ' didn&rsquo;t go through. '
        + esc((camItems.filter(function(i){ return i.status === "failed"; })[0] || {}).err || "") + '</p>' : '');
  } else {
    h += '<p class="cam-p">Automatic upload isn&rsquo;t switched on yet, so photos are saved on this phone. '
      + 'Use <b>Send all photos</b> to share them.</p>';
  }
  h += '<div class="co-acts">'
    + (c.n ? '<button class="btn' + (camOn() ? '' : ' primary') + '" data-camp="share">Send all photos</button>' : '')
    + (c.bad ? '<button class="btn primary" data-camp="retry">Try again</button>' : '')
    + '</div></section>';
  if(!c.n) h += '<p class="cam-empty">No photos yet. Tap the camera on any room.</p>';
  rooms.forEach(function(room){
    var list = camItems.filter(function(i){ return i.room === room; });
    h += '<section class="co-card"><h3 class="co-h3">' + esc(room) + ' <span class="mono">' + list.length + '</span></h3><div class="cam-grid">';
    list.forEach(function(it){
      var u = URL.createObjectURL(it.blob); camUrls.push(u);
      var st = it.status === "sent" ? "sent" : (it.status === "failed" ? "failed" : "waiting");
      h += '<figure class="cam-ph ' + st + '"><img src="' + u + '" alt="' + esc(room) + ' photo">'
        + '<figcaption>' + (st === "sent" ? "uploaded" : st === "failed" ? "not sent" : "waiting") + '</figcaption>'
        + '<button class="cam-x" data-camp="del" data-id="' + esc(it.id) + '" aria-label="Delete this photo">&times;</button></figure>';
    });
    h += '</div></section>';
  });
  if(c.n && c.n > c.left){
    h += '<button class="co-new" data-camp="clear">Remove uploaded photos from this phone</button>';
  }
  camEl.querySelector(".co-body").innerHTML = h;
}
function camShare(){
  var files = camItems.map(function(i){ return new File([i.blob], i.name, {type:"image/jpeg"}); });
  if(navigator.canShare && navigator.canShare({files:files})){
    navigator.share({files:files, title:"Photos - " + JOB.short}).catch(function(){});
    return;
  }
  camItems.forEach(function(i, n){
    setTimeout(function(){
      var u = URL.createObjectURL(i.blob), a = document.createElement("a");
      a.href = u; a.download = i.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
    }, n * 300);
  });
}
function camPanelClick(e){
  var b = e.target.closest("[data-camp]");
  if(!b) return;
  var a = b.dataset.camp;
  if(a === "close") return camPanelClose();
  if(a === "share") return camShare();
  if(a === "retry") return camRetry();
  if(a === "del"){
    var it = camItems.filter(function(i){ return i.id === b.dataset.id; })[0];
    if(!it) return;
    return ask("Delete this photo?",
      it.status === "sent" ? "It stays in Drive; this only removes it from this phone." : "It hasn't been uploaded yet, so it will be gone for good.",
      "Delete", function(){
        camItems = camItems.filter(function(i){ return i !== it; });
        camRemove(it.id).then(camRefresh);
      });
  }
  if(a === "clear"){
    return ask("Remove uploaded photos from this phone?", "They stay in Drive. Photos still waiting to upload are kept.",
      "Remove", function(){
        var gone = camItems.filter(function(i){ return i.status === "sent"; });
        camItems = camItems.filter(function(i){ return i.status !== "sent"; });
        Promise.all(gone.map(function(i){ return camRemove(i.id); })).then(camRefresh);
      });
  }
}

/* ---- wiring ---- */
document.getElementById("wrap").addEventListener("click", function(e){
  var b = e.target.closest("[data-cam]");
  if(b) camTake(b.dataset.cam);
});
document.getElementById("camAll").addEventListener("click", camPanelOpen);
camOpenDB().then(function(db){ camDB = db; return camLoad(); }).then(function(all){
  camItems = all.filter(function(i){ return i.turn === JOB.turn; })
    .sort(function(a, b){ return a.at < b.at ? -1 : 1; });
  camRefresh();
  camPump();
});
window.addEventListener("online", camRetry);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) camRetry(); });
setInterval(camRetry, 30000);

/* ============================ CONFIRM ============================ */
var askEl = null, askPrev = null;
function ask(title, detail, okLabel, onYes){
  closeAsk();
  askPrev = document.activeElement;
  askEl = document.createElement("div");
  askEl.className = "ask";
  askEl.innerHTML = '<div class="ask-card" role="alertdialog" aria-modal="true" aria-labelledby="askT">'
    + '<h3 id="askT">' + esc(title) + '</h3>'
    + '<p>' + esc(detail) + '</p>'
    + '<div class="ask-row">'

    + '</div></div>';
  document.body.appendChild(askEl);
  document.body.style.overflow = "hidden";
  askEl.addEventListener("click", function(e){
    if(e.target === askEl || e.target.closest('[data-ask="no"]')) return closeAsk();
    if(e.target.closest('[data-ask="yes"]')){ var f = onYes; closeAsk(); f(); }
  });
  document.addEventListener("keydown", askKeys);
  var y = askEl.querySelector('[data-ask="yes"]'); if(y) y.focus();
}
function askKeys(e){ if(e.key === "Escape") closeAsk(); }
function closeAsk(){
  if(!askEl) return;
  askEl.remove(); askEl = null;
  document.removeEventListener("keydown", askKeys);
  if(!lb && !coEl && !coPhEl && !camEl) document.body.style.overflow = "";
  if(askPrev && askPrev.focus) { try{ askPrev.focus(); }catch(e){} }
  askPrev = null;
}

/* marking complete asks first; reopening never does */
function setDone(id, yes, after){
  if(!yes){
    delete state.done[id]; delete DONE_BY[id]; save(); commitTask(id, false);
    if(after) after(); return;
  }
  ask("Mark this complete?", byId[id].name, "Yes, complete it", function(){
    state.done[id] = true;
    DONE_BY[id] = {by:UID || (typeof SYNC_ME === "string" ? SYNC_ME : "") || "", at:new Date().toISOString()};
    save(); commitTask(id, true);
    if(after) after();
  });
}

/* ============================ LIGHTBOX ============================ */
var lb = null, lbIdx = 0, lbList = [];
function openPhoto(id){
  lbList = (view === "mat" ? T : groups().reduce(function(a, g){
    g.items.filter(visible).forEach(function(t){ if(a.indexOf(t) === -1) a.push(t); }); return a;
  }, []));
  lbList = lbList.filter(function(t){ return t.ph; });
  if(lbList.indexOf(byId[id]) === -1) lbList = T.filter(function(t){ return t.ph; });
  lbIdx = lbList.indexOf(byId[id]);
  document.body.style.overflow = "hidden";
  lb = document.createElement("div");
  lb.className = "lb";
  lb.innerHTML =
    '<div class="lb-bar"><div class="lb-t" id="lbT"></div>'
    + '<button id="lbX" aria-label="Close photo"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>'
    + '<div class="lb-img"><img id="lbI" alt=""></div>'
    + '<div class="lb-nav"><button id="lbP">&larr; Prev</button>'
    + '<button class="lb-mark" id="lbM"></button>'
    + '<span class="lb-c" id="lbC"></span>'
    + '<button id="lbN">Next &rarr;</button></div>';
  document.body.appendChild(lb);
  lb.addEventListener("click", function(e){
    if(e.target === lb || e.target.closest("#lbX")) return closePhoto();
    if(e.target.closest("#lbP")) return step(-1);
    if(e.target.closest("#lbN")) return step(1);
    if(e.target.closest("#lbM")){
      var t = lbList[lbIdx];
      setDone(t.id, !state.done[t.id], function(){ paint(); render(); });
    }
  });
  document.addEventListener("keydown", keys);
  var sx = 0;
  lb.addEventListener("touchstart", function(e){ sx = e.changedTouches[0].clientX; }, {passive:true});
  lb.addEventListener("touchend", function(e){
    var dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 55) step(dx < 0 ? 1 : -1);
  }, {passive:true});
  paint();
}
function paint(){
  var t = lbList[lbIdx]; if(!t || !lb) return;
  lb.querySelector("#lbI").src = "photos/" + pad(t.ph) + ".jpg";
  lb.querySelector("#lbT").innerHTML = esc(t.name) + "<span>" + esc(roomsOf(t).slice(0,3).join(", "))
    + (t.rooms.length > 3 ? " +" + (t.rooms.length - 3) + " more" : "") + "</span>";
  lb.querySelector("#lbC").textContent = (lbIdx + 1) + " / " + lbList.length;
  lb.querySelector("#lbP").disabled = lbIdx === 0;
  lb.querySelector("#lbN").disabled = lbIdx === lbList.length - 1;
  var m = lb.querySelector("#lbM"), d = !!state.done[t.id];
  m.textContent = d ? "✓ Complete — reopen" : "Mark complete";
  m.className = "lb-mark" + (d ? " on" : "");
}
function step(n){
  var i = lbIdx + n;
  if(i < 0 || i >= lbList.length) return;
  lbIdx = i; paint();
}
function keys(e){
  if(e.key === "Escape") closePhoto();
  else if(e.key === "ArrowLeft") step(-1);
  else if(e.key === "ArrowRight") step(1);
}
function closePhoto(){
  if(!lb) return;
  lb.remove(); lb = null;
  document.body.style.overflow = "";
  document.removeEventListener("keydown", keys);
}

/* ============================ EVENTS ============================ */
document.getElementById("wrap").addEventListener("click", function(e){
  var tickBtn = e.target.closest('[data-act="tick"]');
  if(tickBtn){
    var id = +tickBtn.closest(".task").dataset.id;
    setDone(id, !state.done[id], render); return;
  }
  var re = e.target.closest('[data-act="reopen"]');
  if(re){ setDone(+re.closest(".task").dataset.id, false, render); return; }
  var ph = e.target.closest('[data-act="photo"]');
  if(ph){ openPhoto(+ph.closest(".task").dataset.id); return; }
  var addb = e.target.closest('[data-act="add"]');
  if(addb){
    var aid = addb.dataset.mid;
    state.cart[aid] = true;
    save(); commitMat(aid); render();
    return;
  }
  var rmb = e.target.closest('[data-act="remove"]');
  if(rmb){
    delete state.cart[rmb.dataset.mid];
    save(); commitMat(rmb.dataset.mid); render();
    return;
  }
  var mt = e.target.closest('[data-act="mtick"]');
  if(mt){
    var mid = mt.closest(".mat").dataset.mid;
    state.mats[mid] = !state.mats[mid]; save(); commitMat(mid); render(); return;
  }
  var mc = e.target.closest('[data-act="mcart"]');
  if(mc){
    var mcid = mc.closest(".mat").dataset.mid;
    if(state.cart[mcid]) delete state.cart[mcid]; else state.cart[mcid] = true;
    save(); commitMat(mcid); render(); return;
  }
  var cv = e.target.closest("[data-cart-view]");
  if(cv){
    cartOnly = cv.dataset.cartView === "1";
    try{ localStorage.setItem(KEY + ".co", cartOnly ? "1" : "0"); }catch(e2){}
    render(); return;
  }
  if(e.target.closest("#addAll")){
    MATS.forEach(function(m){ state.cart[m.id] = true; commitMat(m.id); });
    save(); render(); return;
  }
  if(e.target.closest("#emptyCart")){
    state.cart = {}; save(); MATS.forEach(function(m){ commitMat(m.id); }); render(); return;
  }
  var qb = e.target.closest("[data-qty]");
  if(qb){
    var qmid = qb.dataset.qty;
    setQty(qmid, qtyOf(MATS.filter(function(x){ return x.id === qmid; })[0]) + (+qb.dataset.d));
    render();
    var f = document.getElementById("q_" + qmid); if(f) f.focus();
    return;
  }
  var qr = e.target.closest("[data-qrst]");
  if(qr){ delete state.qty[qr.dataset.qrst]; save(); commitMat(qr.dataset.qrst); render(); return; }
  if(e.target.closest("#copyList")){
    var cb = e.target.closest("#copyList");
    if(navigator.clipboard){
      navigator.clipboard.writeText(cartText()).then(function(){
        cb.textContent = "Copied";
        setTimeout(function(){ cb.textContent = "Copy list"; }, 2000);
      });
    }
    return;
  }
  if(e.target.closest("#openAll")){
    var oa = e.target.closest("#openAll");
    var todo = MATS.filter(function(m){ return state.cart[m.id] && !state.mats[m.id] && m.q; });
    todo.forEach(function(m, i){
      setTimeout(function(){ window.open(STORES.hd[2] + encodeURIComponent(m.q), "_blank", "noopener"); }, i * 260);
    });
    oa.textContent = "Opening " + todo.length + "…";
    setTimeout(function(){ oa.textContent = "Look up all on Home Depot"; }, todo.length * 260 + 1200);
    return;
  }  if(e.target.closest("#clearMats")){
    state.mats = {}; save(); MATS.forEach(function(m){ commitMat(m.id); }); render(); return;
  }
});

document.getElementById("wrap").addEventListener("change", function(e){
  if(e.target.id === "hideSettled"){ hideSettled = e.target.checked; save2(); render(); return; }
  var qi = e.target.closest("[data-qin]");
  if(qi){ setQty(qi.dataset.qin, parseInt(qi.value, 10) || 1); render(); return; }
});


document.getElementById("cartbar").addEventListener("click", function(e){
  if(!e.target.closest("[data-cb]")) return;
  cartOnly = true;
  try{ localStorage.setItem(KEY + ".co", "1"); }catch(e2){}

document.getElementById("jump").addEventListener("click", function(e){
  var b = e.target.closest("[data-jump]"); if(!b) return;

  if(id === "top") return window.scrollTo({top:0, behavior:"smooth"});

  var y = el.getBoundingClientRect().top + window.scrollY - document.querySelector(".top").offsetHeight - 10;
  window.scrollTo({top:y, behavior:"smooth"});

function setView(v, keepScroll){
  view = v;
  document.getElementById("vRoom").setAttribute("aria-selected", v === "room");
  document.getElementById("vTrade").setAttribute("aria-selected", v === "trade");

  render(); if(!keepScroll) window.scrollTo({top:0});
}
document.getElementById("vRoom").onclick = function(){ setView("room"); };
document.getElementById("vTrade").onclick = function(){ setView("trade"); };
document.getElementById("vMat").onclick = function(){ setView("mat"); };
document.getElementById("q").addEventListener("input", function(e){
  query = e.target.value.trim().toLowerCase();
  if(view === "mat") setView("room"); else render();
});
document.getElementById("hideDone").addEventListener("change", function(e){
  hideDone = e.target.checked; render();
});
document.getElementById("toTop").onclick = function(){ window.scrollTo({top:0, behavior:"smooth"}); };

try{ var v0 = localStorage.getItem(KEY + ".view"); if(v0) view = v0; }catch(e){}
MATS.forEach(function(m){ MID[m.id] = m; });
setView(view);

/* shrink the header once they start scrolling — it's 1/3 of a phone screen otherwise */
(function(){
  var top = document.querySelector(".top"), ticking = false, isCompact = false, lockUntil = 0;
  function upd(){
    ticking = false;
    /* ignore scroll events for a beat after a toggle: collapsing the header
       shortens the page, which moves scrollY on its own and would otherwise
       toggle us straight back — that feedback is what made it shake */
    if(Date.now() < lockUntil) return;
    var y = window.scrollY || 0;
    if(!isCompact && y > 120){ isCompact = true; top.classList.add("compact"); lockUntil = Date.now() + 260; }
    else if(isCompact && y < 24){ isCompact = false; top.classList.remove("compact"); lockUntil = Date.now() + 260; }
  }
  window.addEventListener("scroll", function(){
    if(!ticking){ ticking = true; requestAnimationFrame(upd); }
  }, {passive:true});
  upd();
})();

/* ============================ SHARED CREW LIST ============================ */
function setMode(m){
  MODE = m;
  var el = document.getElementById("mode");
  if(!el) return;
  el.className = "mode " + m;
  el.textContent = m === "shared" ? "Shared with your crew — live"
    : m === "connecting" ? "Connecting…"
    : m === "offline" ? "No signal. Changes will sync"
    : "This device only";
}

function whoAndWhen(id){
  var r = DONE_BY[id];
  if(!r) return "";
  var bits = [];
  var me = typeof SYNC_ME === "string" ? SYNC_ME : "";
  var nm = r.by ? ((r.by === UID || (me && r.by === me)) ? "You" : (NAMES[r.by] || (/^u_/.test(r.by) ? "" : r.by))) : "";
  if(nm) bits.push(nm);
  if(r.at){
    var d = new Date(r.at);
    if(!isNaN(d)){
      var today = new Date();
      var sameDay = d.toDateString() === today.toDateString();
      bits.push(sameDay
        ? d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})
        : d.toLocaleDateString([], {month:"short", day:"numeric"}));
    }
  }
  return bits.join(" · ");
}

/* resolve display names for whoever appears in the shared state */
var namesPending = false;
function refreshNames(){
  if(!USER || namesPending) return;
  var ids = [];
  Object.keys(DONE_BY).forEach(function(k){
    var b = DONE_BY[k].by;
    if(b && b !== UID && !(b in NAMES) && ids.indexOf(b) === -1) ids.push(b);
  });
  if(!ids.length) return;
  namesPending = true;
  USER.profiles(ids).then(function(ps){
    var changed = false;
    ids.forEach(function(i){ NAMES[i] = (ps[i] && ps[i].name) || ""; changed = true; });
    namesPending = false;
    if(changed) render();
  }, function(){ namesPending = false; });
}

var seeded = false;
function seedFromDevice(taskSnapEmpty){
  /* first crew member to open it brings their own ticks along, once */
  if(seeded || !taskSnapEmpty) return;
  seeded = true;
  var localDone = Object.keys(state.done);
  if(localDone.length) localDone.forEach(function(id){ commitTask(id, true); });
  MATS.forEach(function(m){
    if(state.cart[m.id] || state.mats[m.id] || state.qty[m.id] || state.store[m.id]) commitMat(m.id);
  });
}

function onTasks(snap){
  var next = {}, by = {};
  snap.docs.forEach(function(d){
    var v = d.data() || {};
    if(v.done){ next[d.id] = true; by[d.id] = {by:v.by || "", at:v.at || ""}; }
  });
  seedFromDevice(snap.empty && !snap.metadata.fromCache);
  state.done = next; DONE_BY = by;
  save(); render(); refreshNames();
}

function onMats(snap){
  var cart = {}, got = {}, qty = {}, store = {};
  snap.docs.forEach(function(d){
    var v = d.data() || {}, m = MID[d.id];
    if(!m) return;
    if(v.cart) cart[d.id] = true;
    if(v.got) got[d.id] = true;
    if(typeof v.qty === "number" && v.qty !== m.qty) qty[d.id] = v.qty;
    if(v.store && v.store !== m.store && STORES[v.store]) store[d.id] = v.store;
  });
  state.cart = cart; state.mats = got; state.qty = qty; state.store = store;
  save(); render();
}

(function connect(){
  if(typeof BACKEND_URL === "string" && BACKEND_URL && typeof syncStart === "function"){ syncStart(); return; }
  if(!window.claude || typeof window.claude.use !== "function"){ setMode("local"); return; }
  setMode("connecting");
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0]; USER = r[1];
    var idp = USER ? USER.id() : Promise.resolve(null);
    return idp.then(function(uid){
      UID = uid;
      if(!db){ setMode("local"); return; }
      DB = db;
      setMode("shared");
      DB.collection("tasks").onSnapshot(onTasks, function(e){ dbFail(e); setMode("local"); });
      DB.collection("mats").onSnapshot(onMats, function(e){ dbFail(e); });
    });
  }).catch(function(){ setMode("local"); });
})();
</script>
