<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Florida's Green Thumb — Turn Sheets</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turn Sheets">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#E9ECEA; --surface:#FFFFFF; --surface-2:#F3F5F4;
  --ink:#161A19; --ink-2:#414A48; --muted:#6B7472; --line:#CDD4D1; --line-2:#DEE3E1;
  --brand:#0F766E; --brand-soft:#D9EEEB; --flag:#9A5B12;
  --shadow:0 1px 2px rgba(22,26,25,.06),0 8px 22px -10px rgba(22,26,25,.20);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121615; --surface:#1B211F; --surface-2:#222927;
  --ink:#ECF0EE; --ink-2:#C2CAC7; --muted:#8C9793; --line:#333C39; --line-2:#2A312F;
  --brand:#4DD6C5; --brand-soft:#123430; --flag:#E8B871;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:40px;height:40px;flex:0 0 auto;border-radius:10px;background:var(--brand);
  display:grid;place-items:center;color:#fff}
.brand .mark svg{width:23px;height:23px}
.brand h1{font-size:19px;font-weight:700;line-height:1.1}
.brand .sub{font-size:12.5px;color:var(--muted);margin-top:1px}

/* login */
.gate{display:grid;place-items:center;min-height:70vh;padding:24px 16px}
.gate-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:16px;padding:24px 22px;box-shadow:var(--shadow);text-align:center}
.gate-card .mark{width:52px;height:52px;margin:0 auto 14px;border-radius:13px;background:var(--brand);
  display:grid;place-items:center;color:#fff}
.gate-card .mark svg{width:28px;height:28px}
.gate-card h2{font-size:20px;font-weight:700}
.gate-card p{margin:6px 0 18px;font-size:14px;color:var(--muted)}
.gate-card input{display:block;width:100%;min-height:48px;padding:12px 14px;font:inherit;font-size:16px;
  text-align:center;letter-spacing:.02em;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px}
.gate-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.gate-card button{margin-top:12px;width:100%;min-height:48px;border:0;border-radius:10px;
  background:var(--brand);color:#fff;font-family:"Barlow Semi Condensed",sans-serif;
  font-weight:700;font-size:16px;letter-spacing:.02em}
.gate-err{margin-top:12px;font-size:13.5px;color:var(--flag);min-height:18px}

/* list */
main{padding:18px 0 40px}
.lead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px}
.lead h2{font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.lead .count{font-size:13px;color:var(--muted)}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--line-2);border-radius:14px;padding:15px 16px;margin-bottom:11px;
  box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.99)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.addr{font-family:"Barlow Semi Condensed",sans-serif;font-size:19px;font-weight:700;line-height:1.15}
.cotag{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:var(--flag);background:rgba(154,91,18,.10);border:1px solid rgba(154,91,18,.25);border-radius:999px;padding:2px 9px}
.donetag{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:999px;padding:2px 10px}
.card.done{opacity:.72}
.card.done .bar i{background:var(--brand)}
.card.done:active{opacity:.9}
.city{font-size:13px;color:var(--muted);margin-top:1px}
.go{flex:0 0 auto;color:var(--brand);font-weight:700;font-family:"Barlow Semi Condensed",sans-serif;
  font-size:14px;display:flex;align-items:center;gap:3px;padding-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line-2);color:var(--ink-2)}
.chip.turn{font-family:"IBM Plex Mono",monospace}
.chip.total{font-family:"IBM Plex Mono",monospace;color:var(--brand);border-color:transparent;background:var(--brand-soft)}
.bar{margin-top:13px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-2)}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;width:0;transition:width .4s}
.prog{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:13px;color:var(--ink-2)}
.prog .mono{font-weight:600}
.prog .live{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.prog .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.prog .live.on{color:var(--brand)}
.prog .live.on::before{background:var(--brand)}
.rolebadge{display:inline-block;margin:0 2px 10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 11px}
.rolebadge:empty{display:none}
.alertsbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;
  min-height:46px;padding:11px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);
  color:var(--brand);font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.alertsbtn.on{color:var(--muted);background:var(--surface-2);border-style:dashed}
.alertsbtn[hidden]{display:none}
.alertshint{margin:-4px 2px 14px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.alertshint[hidden]{display:none}
.managecrew{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;
  min-height:46px;padding:11px 14px;border:1px solid var(--brand);border-radius:12px;background:var(--brand-soft);
  color:var(--brand);font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px}
.managecrew[hidden]{display:none}
.jobwrap{margin-bottom:11px}
.jobwrap .card{margin-bottom:0}
.assignbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:-2px 0 0;padding:8px 14px;background:var(--surface-2);border:1px solid var(--line-2);border-top:0;
  border-radius:0 0 14px 14px}
.assignbar.unassigned{background:var(--flag-soft,rgba(154,91,18,.10));border-color:rgba(154,91,18,.30)}
.assignbar.unassigned .asg-who b{color:var(--flag)}
.assignbar.unassigned .asg-btn{border-color:var(--flag);color:var(--flag)}
.asg-who{font-size:12.5px;color:var(--ink-2)}
.asg-who b{color:var(--ink)}
.asg-btn{padding:6px 12px;border:1px solid var(--brand);border-radius:8px;background:var(--surface);
  color:var(--brand);font-weight:700;font-size:12.5px}
/* manager modals */
.mm{position:fixed;inset:0;z-index:200;background:rgba(10,13,12,.5);display:grid;place-items:center;
  padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.mm-card{width:100%;max-width:420px;max-height:86vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line-2);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.mm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mm-top h3{font-size:19px;font-weight:700}
.mm-x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
.mm-p{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0 0 14px}
.mm-add{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.mm-in{min-height:46px;padding:11px 13px;font:inherit;font-size:15px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.mm-in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mm-btn{min-height:46px;padding:11px 16px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px}
.mm-btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.mm-err{font-size:12.5px;color:var(--flag);min-height:16px;margin:4px 0}
.mm-list{margin-top:6px;display:flex;flex-direction:column;gap:8px}
.mm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
  border:1px solid var(--line-2);border-radius:11px;background:var(--surface-2)}
.mm-name{font-weight:600;color:var(--ink)}
.mm-code{font-size:12.5px;color:var(--muted)}
.mm-code b{font-family:"IBM Plex Mono",monospace;color:var(--brand)}
.mm-del{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600}
.mm-empty,.mm-load{font-size:13.5px;color:var(--muted);text-align:center;padding:16px 8px}
.asg-list{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px}
.asg-mode{align-items:flex-start;margin-bottom:6px}
.asg-mode input{margin-top:2px}
.asg-mode small{color:var(--muted);font-size:12.5px;line-height:1.35}
.asg-mode:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.asg-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line-2);
  border-radius:10px;font-size:15px;color:var(--ink);cursor:pointer}
.asg-row input{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto}
.mm-acts{display:flex;gap:10px;margin-top:6px}
.mm-acts .mm-btn{flex:1}
/* completed scopes: collapsible folder at the bottom */
.donesec{margin-top:14px}
.donehdr{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:13px 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
  box-shadow:var(--shadow);color:var(--ink);font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:15px}
.donehdr .dh-l{display:flex;align-items:center;gap:9px}
.donehdr .dh-l>svg{width:19px;height:19px;flex:0 0 auto;color:var(--brand)}
.dh-n{display:inline-grid;place-items:center;min-width:23px;height:22px;padding:0 7px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700}
.dh-chev{width:18px;height:18px;flex:0 0 auto;color:var(--muted);transition:transform .18s}
.donehdr.open .dh-chev{transform:rotate(180deg)}
.donebody{margin-top:11px}
.donebody[hidden]{display:none}
.donesec[hidden]{display:none}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 4px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:12px}
</style>
</head>
<body>
<div id="app" hidden>
  <div class="top"><div class="top-in"><div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M12 9c0-3 2-5 6-5 0 4-3 5-6 5zM12 12C12 9 9 7 5 7c0 4 4 5 7 5z"/></svg></span>
    <div><h1>Florida&rsquo;s Green Thumb</h1><div class="sub">Turn sheets &middot; crew hub</div></div>
  </div></div></div>
  <main class="wrap">
    <div class="lead"><h2>Active turn sheets</h2><span class="count" id="count"></span></div>
    <div class="rolebadge" id="roleBadge"></div>
    <button class="managecrew" id="manageCrew" type="button" hidden>&#128101; Manage crew &amp; codes</button>
    <button class="alertsbtn" id="alerts" hidden></button>
    <div class="alertshint" id="alertsHint" hidden></div>
    <div id="list"></div>
    <div id="doneSec" class="donesec" hidden>
      <button class="donehdr" id="doneToggle" type="button" aria-expanded="false">
        <span class="dh-l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg> Completed scopes <span class="dh-n" id="doneCount">0</span></span>
        <svg class="dh-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="doneList" class="donebody" hidden></div>
    </div>
  </main>
  <div class="foot">Tap a job to open its checklist, carts, photos and change order. <button id="out">Switch code / log out</button></div>
</div>

<div id="gate" class="gate">
  <div class="gate-card">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M12 9c0-3 2-5 6-5 0 4-3 5-6 5zM12 12C12 9 9 7 5 7c0 4 4 5 7 5z"/></svg></span>
    <h2>Florida&rsquo;s Green Thumb</h2>
    <p>Crew turn sheets. Enter the crew code to see active jobs.</p>
    <form id="gform"><input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="Crew code" aria-label="Crew code">
    <button type="submit">Open</button></form>
    <div class="gate-err" id="gerr" role="alert"></div>
  </div>
</div>

<script>
var SCOPES = [{"h1": "10228 Geese Trail Cir", "city": "Sun City Center, FL 33573", "turn": "487966", "turnLabel": "487966", "co": 0, "completed": true, "completedDate": "2026-09-23", "assignedTo": [], "tasks": 37, "total": 1976.9, "liveUrl": "geese-trail/", "hasCrew": true}, {"h1": "10228 Geese Trail Cir", "city": "Sun City Center, FL 33573", "turn": "487966CO", "turnLabel": "487966", "co": 1, "completed": false, "completedDate": "", "assignedTo": [], "tasks": 4, "total": 455.76, "liveUrl": "geese-trail-co/", "hasCrew": true}, {"h1": "1038 Bridlewood Way", "city": "Brandon, FL 33511", "turn": "553625CR", "turnLabel": "553625", "co": 1, "completed": true, "completedDate": "2026-09-24", "assignedTo": [], "tasks": 21, "total": 1311.78, "liveUrl": "bridlewood-cr/", "hasCrew": true}, {"h1": "1038 Bridlewood Way", "city": "Brandon, FL 33511", "turn": "553625", "turnLabel": "553625", "co": 0, "completed": true, "completedDate": "", "assignedTo": [], "tasks": 51, "total": 3117.76, "liveUrl": "bridlewood/", "hasCrew": false}, {"h1": "3167 Bridge Haven Dr", "city": "Wesley Chapel, FL 33543", "turn": "FL19663", "turnLabel": "FL19663", "co": 0, "completed": false, "completedDate": "", "assignedTo": [], "tasks": 3, "total": 382.55, "liveUrl": "bridge-haven/", "hasCrew": true}, {"h1": "3927 Constantine Loop", "city": "Wesley Chapel, FL 33543", "turn": "152779", "turnLabel": "152779", "co": 0, "completed": false, "completedDate": "", "assignedTo": [], "tasks": 34, "total": 1870.94, "liveUrl": "constantine-loop/", "hasCrew": true}, {"h1": "4910 Hi Vista Cir", "city": "Tampa, FL 33625", "turn": "546674", "turnLabel": "546674", "co": 0, "completed": true, "completedDate": "", "assignedTo": [], "tasks": 6, "total": 114.74, "liveUrl": "hi-vista/", "hasCrew": false}, {"h1": "6387 Atlantic Beach Ave", "city": "Wesley Chapel, FL 33544", "turn": "FL24569", "turnLabel": "FL24569", "co": 0, "completed": true, "completedDate": "2026-09-25", "assignedTo": [], "tasks": 9, "total": 704.0, "liveUrl": "atlantic-beach/", "hasCrew": true}];
var HUB = {"crewPw": "greenthumb", "managerPw": "gtboss", "viewerPw": "1234", "people": [], "backendUrl": "https://script.google.com/macros/s/AKfycbzh70eY91CL5hnjsNk9ha8RZe4b3WGWI9KJWMINnk9pbHzOmMfruAlf4zoW8FU_m7O3Hw/exec", "backendKey": "tp_aDqhdJoELbiXbjS4_65yjwYzEeWAeHB0", "vapidPublic": "BLvvGzm1PCKEff6vfjqWyXjLgozDtPXFZrAot0BN5P4rKz1bADqKCC1tMrPsOhl1-gR__W1pBbVvegpL2AAR_6c"};   /* {pw, backendUrl, backendKey} */

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(n){return "$"+(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}

/* crew people + per-scope assignments live in the back end (manager-managed) */
var PEOPLE = [], ASSIGN = {}, ROSTER = [];
/* sentinel assignment id: matches no real crew person, so a job restricted with
   zero people checked stays HIDDEN from all crew instead of reverting to "everyone".
   (Already in personId() normal form, so the backend stores it unchanged.) */
var HIDDEN = "crew-none";
/* sentinel meaning "open to the whole crew". Needed because the default is now
   HIDDEN: a job with no assignment is shown to NO crew until the manager assigns it,
   so "Everyone" must be an explicit stored choice, not just the absence of one. */
var EVERYONE = "crew-all";
function hubApi(op, extra){
  if(!HUB.backendUrl) return Promise.reject("no backend");
  return fetch(HUB.backendUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({op:op, k:HUB.backendKey}, extra||{}))}).then(function(r){ return r.json(); });
}
function fetchConfig(){
  return hubApi("config").then(function(r){
    if(r && r.ok){
      var changed = JSON.stringify(PEOPLE) !== JSON.stringify(r.people) || JSON.stringify(ASSIGN) !== JSON.stringify(r.assign);
      PEOPLE = r.people || []; ASSIGN = r.assign || {};
      if(changed && !document.getElementById("app").hidden) render();   // only redraw when it actually changed
    }
  }).catch(function(){});
}
function personName(id){ var p = PEOPLE.filter(function(x){ return x.id === id; })[0]; return p ? p.n || p.name : id; }

/* light gate: keeps casual visitors out of a public URL. Not bank security —
   the code lives in the page. Real privacy would need a server login. */
/* two codes: crew (opens the no-price pages) and manager (opens the priced pages) */
var ROLE = "crew", PERSON = "", PERSON_NAME = "";   /* PERSON = logged-in crew person's id ("" = generic crew) */
function unlock(role, personId, personName){
  ROLE = role; PERSON = personId || ""; PERSON_NAME = personName || "";
  try{ sessionStorage.setItem("fgt.in", role);
       sessionStorage.setItem("fgt.pid", PERSON); sessionStorage.setItem("fgt.pn", PERSON_NAME); }catch(e){}
  document.getElementById("gate").hidden = true;
  var app = document.getElementById("app"); app.hidden = false;
  var b = document.getElementById("roleBadge");
  if(b) b.textContent = (role === "manager" ? "Manager — prices shown"
      : role === "viewer" ? "Viewer — look only"
      : PERSON_NAME ? (PERSON_NAME + "'s jobs") : "Crew view") + " · tap to switch";
  var mc = document.getElementById("manageCrew"); if(mc) mc.hidden = (role !== "manager");
  render(); poll(); refreshAlerts(); fetchConfig();
}
document.getElementById("gform").addEventListener("submit",function(e){
  e.preventDefault();
  var v = document.getElementById("pw").value.trim().toLowerCase();
  var err = document.getElementById("gerr");
  if(HUB.managerPw && v === HUB.managerPw){ return unlock("manager"); }
  if(HUB.viewerPw && v === HUB.viewerPw){ return unlock("viewer"); }
  if(v === HUB.crewPw){ return unlock("crew"); }
  /* a personal crew code? the back end holds those (manager-managed) */
  err.textContent = "Checking…";
  hubApi("login", {code:v}).then(function(r){
    if(r && r.ok){ err.textContent = ""; unlock("crew", r.id, r.name); }
    else err.textContent = "That code didn't match. Ask your manager.";
  }).catch(function(){ err.textContent = "Couldn't check that code — try again."; });
});
function relock(){
  try{ sessionStorage.removeItem("fgt.in"); sessionStorage.removeItem("fgt.pid"); sessionStorage.removeItem("fgt.pn"); }catch(e){}
  location.reload();
}
document.getElementById("out").addEventListener("click", relock);
(function(){ var rb = document.getElementById("roleBadge"); if(rb){ rb.style.cursor = "pointer"; rb.addEventListener("click", relock); } })();
try{ var r = sessionStorage.getItem("fgt.in");
  if(r === "manager" || r === "crew" || r === "viewer")
    unlock(r, sessionStorage.getItem("fgt.pid") || "", sessionStorage.getItem("fgt.pn") || "");
}catch(e){}

function jobUrl(s){
  var u = s.liveUrl || "";
  if(ROLE === "crew" || ROLE === "viewer"){ if(u.slice(-1) !== "/") u += "/"; u += "crew/"; }
  if(ROLE === "viewer"){ u += "?view=1"; }        // look-only: no ticking, no uploads
  return u;
}
// "2026-09-23" -> "Sep 23, 2026". Parsed as plain numbers, never through
// new Date("2026-09-23"), which browsers read as UTC midnight and render as
// the day before for anyone west of Greenwich.
function doneDate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if(!m) return String(iso || "");
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return MON[(+m[2])-1] + " " + (+m[3]) + ", " + m[1];
}
function card(s){
  var inner = '<a class="card' + (s.completed ? ' done' : '') + '" href="'+esc(jobUrl(s))+'" data-turn="'+esc(s.turn)+'">'
    + '<div class="card-h"><div><div class="addr">'+esc(s.h1)+'</div>'
    + (s.completed ? '<div class="donetag">&#10003; Done'+(s.completedDate ? ' &middot; '+esc(doneDate(s.completedDate)) : '')+'</div>' : '')
    + (s.co ? '<div class="cotag">Change Order #'+s.co+'</div>' : '')
    + '<div class="city">'+esc(s.city)+'</div></div>'
    + '<span class="go">'+(s.completed ? 'View &rarr;' : 'Open &rarr;')+'</span></div>'
    + '<div class="meta"><span class="chip turn">Turn '+esc(s.turnLabel || s.turn)+'</span>'
    + '<span class="chip">'+s.tasks+' task'+(s.tasks===1?"":"s")+'</span>'
    + (ROLE === "manager" ? '<span class="chip total">'+money(s.total)+'</span>' : '') + '</div>'
    + '<div class="bar"><i data-bar="'+esc(s.turn)+'"></i></div>'
    + '<div class="prog"><span data-done="'+esc(s.turn)+'">Tap to open</span>'
    + '<span class="live" data-live="'+esc(s.turn)+'">not connected</span></div>'
    + '</a>';
  if(ROLE === "manager" && !s.completed && s.hasCrew){
    var raw = ASSIGN[s.turn] || [];                       // may hold real ids and/or a sentinel
    var named = raw.filter(function(x){ return x !== HIDDEN && x !== EVERYONE; });
    var who;
    if(!raw.length) who = "No one yet — not assigned";    // default: hidden from crew until assigned
    else if(raw.indexOf(EVERYONE) !== -1) who = "Everyone";
    else who = named.length ? named.map(personName).join(", ") : "No one — hidden";
    inner += '<div class="assignbar'+(named.length||raw.indexOf(EVERYONE)!==-1?'':' unassigned')+'"><span class="asg-who">Crew: <b>'+esc(who)+'</b></span>'
      + '<button class="asg-btn" type="button" data-assign="'+esc(s.turn)+'">Choose who sees it</button></div>';
  }
  return '<div class="jobwrap">' + inner + '</div>';
}
function canSee(s){
  if(ROLE === "manager") return true;           // manager/owner sees everything
  if(!s.hasCrew) return false;                   // crew + viewer need a no-price build
  if(ROLE === "viewer") return true;             // a viewer (super/client) sees all crew jobs
  var a = ASSIGN[s.turn] || s.assignedTo || [];   // backend assignment wins, spec is a fallback
  if(!a.length) return false;                     // NOT assigned yet = hidden from crew until the manager assigns it
  if(a.indexOf(EVERYONE) !== -1) return true;     // manager explicitly opened it to the whole crew
  return !!PERSON && a.indexOf(PERSON) !== -1;    // otherwise only the assigned people (generic crew, PERSON="", won't match)
}
function render(){
  var visible = SCOPES.filter(canSee);
  var open = visible.filter(function(s){ return !s.completed; });   // active jobs stay in the main list
  var done = visible.filter(function(s){ return s.completed; });    // finished jobs move into the folder
  document.getElementById("count").textContent = open.length + (open.length===1?" job":" jobs");
  document.getElementById("list").innerHTML = open.length
    ? open.map(card).join("")
    : '<div class="foot" style="padding:30px 16px">No open jobs right now.</div>';
  var sec = document.getElementById("doneSec"), t = document.getElementById("doneToggle"), body = document.getElementById("doneList");
  if(done.length){
    sec.hidden = false;
    document.getElementById("doneCount").textContent = done.length;
    body.innerHTML = done.map(card).join("");   // keeps its own open/collapsed state
    if(!DONE_TOUCHED){                            // until the user taps it: open the folder when nothing's still active
      var exp = open.length === 0;
      body.hidden = !exp; t.classList.toggle("open", exp); t.setAttribute("aria-expanded", exp ? "true" : "false");
    }
  } else {
    sec.hidden = true; body.innerHTML = "";
  }
  paintProgress();   // re-apply the last live numbers so a redraw never flashes back to 0
}
var DONE_TOUCHED = false;
(function(){
  var t = document.getElementById("doneToggle"), body = document.getElementById("doneList");
  if(!t || !body) return;
  t.addEventListener("click", function(){
    DONE_TOUCHED = true;
    var willOpen = body.hidden;
    body.hidden = !willOpen;
    t.classList.toggle("open", willOpen);
    t.setAttribute("aria-expanded", willOpen ? "true" : "false");
    if(willOpen) paintProgress();   // fill the bars the moment they're revealed
  });
})();

/* live progress kept here so a re-render can restore it without waiting for the next poll */
var PROG = {};
function seedProg(s){   // a finished job reads full even before/without a backend reply
  return s.completed ? { done:s.tasks, tasks:s.tasks, photos:0, pct:100 }
                     : { done:0, tasks:s.tasks, photos:0, pct:0 };
}
SCOPES.forEach(function(s){ if(s.completed) PROG[s.turn] = seedProg(s); });
function paintProgress(){
  Object.keys(PROG).forEach(function(turn){
    var p = PROG[turn];
    var bar = document.querySelector('[data-bar="'+turn+'"]');
    var txt = document.querySelector('[data-done="'+turn+'"]');
    var live = document.querySelector('[data-live="'+turn+'"]');
    if(bar) bar.style.width = p.pct + "%";
    if(txt) txt.innerHTML = '<span class="mono">'+p.done+'/'+p.tasks+'</span> done'
      + (p.photos ? ' &middot; <span class="mono">'+p.photos+'</span> photos' : '');
    if(live){ live.textContent = "live"; live.className = "live on"; }
  });
}
/* live progress: ask Steve's backend for done-counts + photo counts */
function poll(){
  if(!HUB.backendUrl) return;
  fetch(HUB.backendUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({op:"summary",k:HUB.backendKey})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j || !j.ok) return;
      SCOPES.forEach(function(s){
        var d = (j.scopes && j.scopes[s.turn]) || null;
        if(!d){                                   // backend skipped this scope this cycle —
          if(!PROG[s.turn]) PROG[s.turn] = seedProg(s);   // don't flash back to 0; keep the last known numbers
          return;
        }
        var pct = s.tasks ? Math.round(d.done/s.tasks*100) : 0;
        PROG[s.turn] = { done: d.done, tasks: s.tasks, photos: d.photos || 0, pct: pct };
      });
      paintProgress();
    }).catch(function(){});
}
if(HUB.backendUrl) setInterval(function(){ if(!document.getElementById("app").hidden) poll(); }, 20000);

/* ---- job alerts (web push): buzz the phone when a new scope is posted ---- */
function urlB64ToUint8(b64){
  var pad = "=".repeat((4 - b64.length % 4) % 4);
  var s = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  var raw = atob(s), arr = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){ return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window); }
function isStandalone(){ return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
function isIOS(){ return /iP(hone|ad|od)/.test(navigator.userAgent); }
var swReg = null;
function ensureSW(){
  if(swReg) return Promise.resolve(swReg);
  return navigator.serviceWorker.register("sw.js").then(function(r){ swReg = r; return r; });
}
function alertsPost(op, extra){
  return fetch(HUB.backendUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({op:op, k:HUB.backendKey}, extra || {}))}).then(function(r){ return r.json(); });
}
function refreshAlerts(){
  var b = document.getElementById("alerts"), hint = document.getElementById("alertsHint");
  if(!b) return;
  if(!HUB.backendUrl || !HUB.vapidPublic){ b.hidden = true; hint.hidden = true; return; }
  if(!pushSupported()){
    b.hidden = true;
    if(isIOS() && !isStandalone()){
      hint.hidden = false;
      hint.innerHTML = "🔔 Want a buzz when a new job is posted? On iPhone: tap the <b>Share</b> button → <b>Add to Home Screen</b>, open it from your home screen, then turn on alerts.";
    } else { hint.hidden = true; }
    return;
  }
  b.hidden = false; hint.hidden = true;
  ensureSW().then(function(r){ return r.pushManager.getSubscription(); }).then(function(sub){
    if(sub && Notification.permission === "granted"){ b.className = "alertsbtn on"; b.textContent = "🔔 Job alerts are on"; }
    else { b.className = "alertsbtn"; b.textContent = "🔔 Turn on job alerts"; }
  }).catch(function(){ b.className = "alertsbtn"; b.textContent = "🔔 Turn on job alerts"; });
}
function enableAlerts(){
  var b = document.getElementById("alerts"), hint = document.getElementById("alertsHint");
  if(b && b.classList.contains("on")) return;
  ensureSW().then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm !== "granted") throw new Error("perm");
      return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: urlB64ToUint8(HUB.vapidPublic)});
    });
  }).then(function(sub){
    return alertsPost("subscribe", {sub: sub.toJSON ? sub.toJSON() : sub});
  }).then(function(){ refreshAlerts(); }).catch(function(){
    if(hint){ hint.hidden = false;
      hint.textContent = (window.Notification && Notification.permission === "denied")
        ? "Notifications are blocked for this site in your phone's settings. Turn them on there, then tap again."
        : "Couldn't turn on alerts — try again."; }
  });
}
(function(){ var b = document.getElementById("alerts"); if(b) b.addEventListener("click", enableAlerts); })();

/* ===================== MANAGER: crew people + assignments ===================== */
var mcEl = null, asgEl = null;
function closeModal(el){ if(el){ el.remove(); if(!mcEl && !asgEl) document.body.style.overflow = ""; } }
function openModal(inner){
  var el = document.createElement("div"); el.className = "mm";
  el.innerHTML = '<div class="mm-card">' + inner + '</div>';
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  return el;
}
/* --- Manage crew: add / list / remove people --- */
function openManageCrew(){
  if(mcEl) return;
  mcEl = openModal('<div class="mm-top"><h3>Crew &amp; codes</h3><button class="mm-x" data-mc="close" aria-label="Close">&times;</button></div>'
    + '<p class="mm-p">Add a crew member and pick a login code for them. They enter that code on this page to see only the jobs you assign to them.</p>'
    + '<div class="mm-add"><input id="mcName" class="mm-in" type="text" placeholder="Name (e.g. Bob)" autocomplete="off">'
    + '<input id="mcCode" class="mm-in" type="text" placeholder="Login code (e.g. bob-419)" autocomplete="off">'
    + '<button class="mm-btn" data-mc="add">Add</button></div>'
    + '<div class="mm-err" id="mcErr"></div>'
    + '<div id="mcList" class="mm-list"><div class="mm-load">Loading crew…</div></div>');
  mcEl.addEventListener("click", mcClick);
  hubApi("roster").then(function(r){ if(r && r.ok){ ROSTER = r.people || []; ASSIGN = r.assign || ASSIGN; } paintRoster(); }).catch(function(){ paintRoster(); });
}
function paintRoster(){
  var box = document.getElementById("mcList"); if(!box) return;
  if(!ROSTER.length){ box.innerHTML = '<div class="mm-empty">No crew added yet.</div>'; return; }
  box.innerHTML = ROSTER.map(function(p){
    return '<div class="mm-row"><div><div class="mm-name">'+esc(p.name)+'</div>'
      + '<div class="mm-code">code: <b>'+esc(p.code)+'</b></div></div>'
      + '<button class="mm-del" data-mc="del" data-id="'+esc(p.id)+'">Remove</button></div>';
  }).join("");
}
function mcClick(e){
  var b = e.target.closest("[data-mc]"); if(!b) return;
  var a = b.dataset.mc;
  if(a === "close"){ mcEl = null; return closeModal(e.currentTarget); }
  if(a === "add"){
    var name = document.getElementById("mcName").value.trim();
    var code = document.getElementById("mcCode").value.trim();
    var err = document.getElementById("mcErr");
    if(name.length < 2 || code.length < 2){ err.textContent = "Enter a name and a code (2+ characters)."; return; }
    err.textContent = "Adding…";
    hubApi("addperson", {name:name, code:code}).then(function(r){
      if(r && r.ok){ ROSTER = r.people || []; PEOPLE = ROSTER.map(function(x){return {id:x.id, n:x.name, name:x.name};});
        document.getElementById("mcName").value = ""; document.getElementById("mcCode").value = ""; err.textContent = ""; paintRoster(); render(); }
      else err.textContent = (r && r.error) || "Couldn't add.";
    }).catch(function(){ err.textContent = "Couldn't reach the server."; });
    return;
  }
  if(a === "del"){
    var id = b.dataset.id;
    hubApi("delperson", {id:id}).then(function(r){
      if(r && r.ok){ ROSTER = r.people || []; ASSIGN = r.assign || ASSIGN; PEOPLE = ROSTER.map(function(x){return {id:x.id, n:x.name, name:x.name};}); paintRoster(); render(); }
    }).catch(function(){});
    return;
  }
}
/* --- Assign: who sees this scope --- */
function openAssign(turn){
  var s = SCOPES.filter(function(x){ return x.turn === turn; })[0]; if(!s) return;
  var people = PEOPLE.length ? PEOPLE : ROSTER.map(function(x){return {id:x.id, n:x.name};});
  var cur = ASSIGN[turn] || [];
  var everyone = cur.indexOf(EVERYONE) !== -1;              // explicitly opened to the whole crew
  var rows = people.length ? people.map(function(p){
    var on = cur.indexOf(p.id) !== -1;
    return '<label class="asg-row"><input type="checkbox" data-pid="'+esc(p.id)+'"'+(on?" checked":"")+'><span>'+esc(p.n||p.name)+'</span></label>';
  }).join("") : '<div class="mm-empty">No crew yet — add people under &ldquo;Manage crew&rdquo; first.</div>';
  asgEl = openModal('<div class="mm-top"><h3>Who sees this job?</h3><button class="mm-x" data-asg="close" aria-label="Close">&times;</button></div>'
    + '<p class="mm-p"><b>'+esc(s.h1)+'</b>'+(s.co?' &middot; Change Order #'+s.co:'')+'<br>A job stays hidden from the crew until you assign it here.</p>'
    + '<label class="asg-row asg-mode"><input type="radio" name="asgmode" value="all" data-asg="mode"'+(everyone?" checked":"")+'>'
      + '<span><b>Everyone on the crew</b><br><small>Any crew member can open this job.</small></span></label>'
    + '<label class="asg-row asg-mode"><input type="radio" name="asgmode" value="only" data-asg="mode"'+(everyone?"":" checked")+'>'
      + '<span><b>Only the people I check</b><br><small>Everyone else — including unchecked people — won&rsquo;t see it. Check no one to keep it hidden.</small></span></label>'
    + '<div class="asg-list" id="asgList">'+rows+'</div>'
    + '<div class="mm-err" id="asgErr"></div>'
    + '<div class="mm-acts"><button class="mm-btn ghost" data-asg="close">Cancel</button><button class="mm-btn" data-asg="save" data-turn="'+esc(turn)+'">Save</button></div>');
  asgEl.addEventListener("click", asgClick);
  asgSyncMode();
}
function asgMode(){ var r = document.querySelector('input[name="asgmode"]:checked'); return r ? r.value : "all"; }
function asgSyncMode(){                                     // grey out the people list when "Everyone" is picked
  var list = document.getElementById("asgList"); if(!list) return;
  var only = asgMode() === "only";
  list.style.opacity = only ? "1" : ".4";
  list.style.pointerEvents = only ? "auto" : "none";
}
function asgClick(e){
  var b = e.target.closest("[data-asg]"); if(!b) return;
  var a = b.dataset.asg;
  if(a === "mode"){ asgSyncMode(); return; }
  if(a === "close"){ asgEl = null; return closeModal(e.currentTarget.closest(".mm") || document.querySelector(".mm")); }
  if(a === "save"){
    var turn = b.dataset.turn;
    var err = document.getElementById("asgErr");
    var ids;
    if(asgMode() === "all"){
      ids = [EVERYONE];                                     // Everyone → explicit "whole crew" marker (not just "no assignment")
    } else {
      ids = [].slice.call(document.querySelectorAll("#asgList input:checked")).map(function(c){ return c.dataset.pid; });
      if(!ids.length) ids = [HIDDEN];                       // restricted but nobody checked → hide from all crew (don't reopen)
    }
    err.textContent = "Saving…";
    hubApi("assign", {scope:turn, people:ids}).then(function(r){
      if(r && r.ok){ ASSIGN = r.assign || ASSIGN; asgEl = null; closeModal(document.querySelector(".mm")); render(); }
      else err.textContent = "Couldn't save.";
    }).catch(function(){ err.textContent = "Couldn't reach the server."; });
    return;
  }
}
(function(){ var b = document.getElementById("manageCrew"); if(b) b.addEventListener("click", openManageCrew); })();
document.getElementById("list").addEventListener("click", function(e){
  var b = e.target.closest("[data-assign]");
  if(b){ e.preventDefault(); openAssign(b.dataset.assign); }
});
fetchConfig();
if(HUB.backendUrl) setInterval(function(){ if(!document.getElementById("app").hidden && ROLE) fetchConfig(); }, 30000);
</script>
